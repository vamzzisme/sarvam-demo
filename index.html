<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramesh Bhaiya's Stall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Mukta:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff4dc; --ink:#2b1608; --red:#d7263d; --yellow:#ffc914; --green:#1b998b; --card:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Mukta, system-ui, sans-serif;
         background-image: repeating-linear-gradient(90deg, var(--red) 0 40px, var(--yellow) 40px 80px);
         background-size: 100% 28px; background-repeat:no-repeat; min-height:100vh; }
  main { max-width:640px; margin:0 auto; padding:56px 16px 32px; }
  h1 { font-family:Bungee, sans-serif; font-size:clamp(28px,7vw,44px); line-height:1; margin:0 0 6px; color:var(--red); text-shadow:3px 3px 0 var(--yellow); }
  .sub { margin:0 0 20px; font-size:18px; }
  .tag { display:inline-block; background:var(--yellow); border:3px solid var(--ink); padding:4px 12px; font-weight:700; transform:rotate(-2deg); margin-bottom:20px; }
  .bhaiya { display:flex; align-items:center; gap:16px; margin-bottom:20px; }
  .face { width:84px; height:84px; border-radius:50%; background:var(--yellow); border:4px solid var(--ink);
          display:grid; place-items:center; font-size:44px; flex:none; transition:transform .1s; }
  .face.talking { animation: bob .35s infinite alternate; }
  @keyframes bob { to { transform: scale(1.12) rotate(-4deg); } }
  #state { font-weight:700; font-size:18px; }
  button { font-family:Bungee, sans-serif; font-size:20px; padding:14px 24px; border:4px solid var(--ink); border-radius:12px;
           cursor:pointer; box-shadow:5px 5px 0 var(--ink); }
  button:active { transform:translate(3px,3px); box-shadow:2px 2px 0 var(--ink); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #start { background:var(--green); color:#fff; }
  #stop { background:var(--red); color:#fff; }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px; }
  #log { display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border:3px solid var(--ink); border-radius:14px; font-size:18px; background:var(--card); }
  .bot { align-self:flex-start; background:#ffe9a8; }
  .user { align-self:flex-end; background:#c8f2ec; }
  .msg b { display:block; font-size:13px; opacity:.7; }
  #err { color:var(--red); font-weight:700; }
  .hint { opacity:.75; font-size:15px; margin-top:24px; }
</style>
</head>
<body>
<main>
  <h1>Ramesh Bhaiya's Stall</h1>
  <p class="sub">Sarojini Nagar • "100% original" Gucchi shirt</p>
  <div class="tag">MRP ₹1,200 • Can you beat Bhaiya?</div>

  <div class="bhaiya">
    <div class="face" id="face" aria-hidden="true">🧔🏽</div>
    <div><div id="state">Stall is open. Press start and talk.</div><div id="err" role="alert"></div></div>
  </div>

  <div class="row">
    <button id="start">Start haggling</button>
    <button id="stop" disabled>Walk away</button>
  </div>

  <div id="log" aria-live="polite"></div>
  <p class="hint">Talk like you would at a real stall. Interrupt him, lowball him, threaten to walk away. Hindi, English or Hinglish all work.</p>
</main>

<script type="module">
import { ConversationAgent, BrowserAudioInterface, InteractionType, AgentState }
  from "https://cdn.jsdelivr.net/npm/sarvam-conv-ai-sdk@0.0.42/dist/browser.js/+esm";

const $ = (id) => document.getElementById(id);
const LABELS = {
  [AgentState.CONNECTING]: "Calling Bhaiya…",
  [AgentState.CONNECTED]: "Bhaiya is here.",
  [AgentState.LISTENING]: "Bhaiya is listening… bolo!",
  [AgentState.SPEAKING]: "Bhaiya is talking…",
  [AgentState.ERROR]: "Something broke.",
  [AgentState.IDLE]: "Stall is open. Press start and talk.",
};
let agent = null;

function add(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot");
  d.innerHTML = `<b>${role === "user" ? "You" : "Ramesh Bhaiya"}</b>`;
  d.append(text);
  $("log").append(d);
  d.scrollIntoView({ behavior: "smooth", block: "end" });
}

function setIdle() {
  agent = null;
  $("start").disabled = false;
  $("stop").disabled = true;
  $("face").classList.remove("talking");
  $("state").textContent = LABELS[AgentState.IDLE];
}

$("start").onclick = async () => {
  $("err").textContent = "";
  $("start").disabled = true;
  try {
    const cfg = await (await fetch("/config.json")).json();
    agent = new ConversationAgent({
      apiKey: cfg.SAMVAAD_API_KEY,
      config: {
        org_id: cfg.ORG_ID,
        workspace_id: cfg.WORKSPACE_ID,
        app_id: cfg.APP_ID,
        user_identifier: "demo-" + Math.random().toString(36).slice(2, 8),
        user_identifier_type: "custom",
        interaction_type: InteractionType.CALL,
        input_sample_rate: 16000,
        output_sample_rate: 16000,
      },
      audioInterface: new BrowserAudioInterface(16000),
      stateCallback: (s) => {
        $("state").textContent = LABELS[s] ?? s;
        $("face").classList.toggle("talking", s === AgentState.SPEAKING);
      },
      transcriptCallback: async (m) => add(String(m.role).toLowerCase(), m.content),
      endCallback: async () => setIdle(),
    });
    await agent.start();
    if (!(await agent.waitForConnect(10))) throw new Error("Bhaiya didn't pick up (connection timed out).");
    $("stop").disabled = false;
  } catch (e) {
    console.error(e);
    $("err").textContent = e.message || String(e);
    await agent?.stop().catch(() => {});
    setIdle();
  }
};

$("stop").onclick = async () => {
  await agent?.stop().catch(console.error);
  setIdle();
};
</script>
</body>
</html>
